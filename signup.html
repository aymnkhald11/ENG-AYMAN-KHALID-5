<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب | IRON GYM</title>
<link rel="icon" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/all.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<header class="header">
  <a href="index.html" class="logo"><span class="s-logo">IRON <strong>GYM</strong></span><img src="images/logo.png" alt="شعار IRON GYM" class="img-logo"></a>
  <button class="burger" aria-label="القائمة" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
  <ul class="list1">
    <li><a href="index.html">الرئيسية</a></li>
    <li><a href="index.html#plans">الباقات</a></li>
    <li><a href="index.html#reviews">آراء الأعضاء</a></li>
    <li><a href="index.html#about">من نحن</a></li>
    <li><a href="index.html#contact">التواصل</a></li>
  </ul>
  <a href="login.html" class="im-client" id="memberBtn">أنا عضو</a>
</header>
<main class="page"><div class="box">
  <h1>إنشاء حساب</h1><p class="sub">سجّل حسابك الأول، وبعدها اختار باقتك وادفع.</p>
  <label class="fl" for="n">الاسم بالكامل</label><input class="fi" id="n" autocomplete="name">
  <label class="fl" for="ph">رقم الموبايل</label><input class="fi" id="ph" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">
  <label class="fl" for="u">اسم المستخدم (حروف إنجليزي وأرقام)</label><input class="fi" id="u" autocomplete="username" autocapitalize="off">
  <label class="fl" for="p">كلمة المرور (4 حروف على الأقل)</label><input class="fi" id="p" type="password" autocomplete="new-password">
  <div class="msg" id="m" role="alert" tabindex="-1"></div>
  <button class="btn-main" id="go">إنشاء الحساب</button>
  <p class="alt">عندك حساب؟ <a href="login.html">سجّل دخول</a></p>
</div></main>
<script src="JS/app.js"></script>
<script src="JS/signup.js"></script>
</body>
</html>
